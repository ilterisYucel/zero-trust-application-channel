# Tag ile yayın: npm (lib) + Docker Hub (hub/agent) + GitHub Releases (agent binaries).
#
# Gerekli GitHub secret'lar:
#   NPM_TOKEN          — npm granular token (read-write + bypass 2FA)
#   DOCKERHUB_USERNAME — Docker Hub kullanıcı adı (ör. ilterisyucel)
#   DOCKERHUB_TOKEN    — Docker Hub access token (read-write)
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  npm-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: npm auth preflight
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "::error::NPM_TOKEN secret bos/eksik (repo Settings > Secrets)"; exit 1; fi
          echo "token length: ${#NPM_TOKEN}"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm whoami || { echo "::error::npm whoami basarisiz — token gecersiz/2FA bypass yok"; exit 1; }
      - name: Publish lib to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > lib/.npmrc
          cd lib && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hub, agent]
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-trust-application-channel-${{ matrix.component }}:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-trust-application-channel-${{ matrix.component }}:latest

  binaries:
    needs: [npm-lib, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Agent workspace link lib'in dist'ini bekler (Dockerfile ile aynı sıra).
      - name: Build lib
        run: bun run --cwd lib build
      - name: Build agent binaries
        run: |
          bun run build:agent:arm64
          bun run build:agent:x64
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/agent-arm64
            agent/dist/agent-x64
          generate_release_notes: true
