# Tag ile yayın: npm (lib) + Docker Hub (hub/agent).
#
# Gerekli GitHub secret'lar:
#   NPM_TOKEN          — npm granular token (read-write + bypass 2FA)
#   DOCKERHUB_USERNAME — Docker Hub kullanıcı adı (ör. ilterisyucel)
#   DOCKERHUB_TOKEN    — Docker Hub access token (read-write)
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  npm-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Publish lib to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > lib/.npmrc
          cd lib && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hub, agent]
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-trust-application-channel-${{ matrix.component }}:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zero-trust-application-channel-${{ matrix.component }}:latest
