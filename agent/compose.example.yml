# Agent — compose örneği (Docker Hub imajıyla).
# Config yoksa (env eksikse) 8080'de setup UI açılır; config volume'e yazılır.
# Bootstrap modunda tek kullanımlık token claim edilir, kalıcı secret volume'e
# yazılır ve sonraki başlatmalarda env'deki token'ı ezer.
name: agent

services:
  agent:
    # Kendi Docker Hub kullanıcı/org adınızla değiştirin.
    image: ${AGENT_IMAGE:-ilterisyucel/zero-trust-application-channel-agent:1.0.0}
    container_name: agent
    environment:
      HUB_URL: ${HUB_URL:-http://hub:5003}
      PEER_ID: ${PEER_ID:-revpi-1}
      SERVICE_ID: ${SERVICE_ID:-revpi-dashboard}
      LOCAL_TARGET: ${LOCAL_TARGET:-http://cockpit-app:41443}
      PEER_TOKEN: ${PEER_TOKEN:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      TLS_INSECURE: ${TLS_INSECURE:-0}
    volumes:
      - agent-config:/etc/agent
    ports:
      - "${SETUP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  agent-config:
